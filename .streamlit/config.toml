# scripts/serve.sh passes --server.port and --server.address from manifest.yaml.
# These defaults match the manifest so `streamlit run` also binds the public port.

[server]
port = 6006
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
